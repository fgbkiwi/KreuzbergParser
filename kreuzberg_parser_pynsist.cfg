# ============================================================
# Pynsist Configuration: KreuzbergParser
# ============================================================
# Build prerequisites:
#   1) .\scripts\update_deps.ps1 -Sync
#   2) NSIS installed
#   3) .\build_kreuzberg_parser_pynsist.ps1
#
# Note: the CUDA stack (torch, onnxruntime-gpu, …) makes the installer large.
# Packages are copied from the active .venv used to run pynsist.

[Application]
name=KreuzbergParser
# version: sincronizado de APP_VERSION (main.py) via bump_version.py
version=1.0.6
entry_point=_kreuzberg_launcher:main
icon=kreuzberg-parser.ico
console=false

[Python]
version=3.12.10
bitness=64

[Include]
packages=kreuzberg
         pytesseract
         easyocr
         transformers
         PIL
         flet
         tqdm
         psutil
         dotenv
         numpy
         scipy
         skimage
         yaml
         shapely
         onnxruntime
         torch
         torchvision
         core
         ui
         utils
         scripts

files=main.py
      config.py
      _kreuzberg_launcher.py
      kreuzberg.toml
      assets\kreuzberg-parser.png
      kreuzberg-parser.ico
      .venv\Lib\site-packages\cv2 > $INSTDIR\pkgs\cv2
      .venv\Lib\site-packages\numpy.libs > $INSTDIR\pkgs\numpy.libs
      .venv\Lib\site-packages\scipy.libs > $INSTDIR\pkgs\scipy.libs
      .venv\Lib\site-packages\shapely.libs > $INSTDIR\pkgs\shapely.libs
