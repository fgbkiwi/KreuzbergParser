# ============================================================
# Pynsist Configuration: KreuzbergParser
# ============================================================
# Build prerequisites:
#   1) .\scripts\update_deps.ps1 -Sync
#   2) NSIS installed
#   3) .\build_kreuzberg_parser_pynsist.ps1
#
# Note: the CUDA stack (torch, onnxruntime-gpu, …) makes the installer large.
# Packages are copied from the active .venv used to run pynsist.

[Application]
name=Kiwi Down
# version: sincronizado de APP_VERSION (main.py) via bump_version.py
version=1.1.0
entry_point=_kreuzberg_launcher:main
icon=assets\KiwiDown.ico
console=false

[Python]
version=3.12.10
bitness=64

[Include]
packages=kreuzberg
         pytesseract
         rapidocr
         pyclipper
         omegaconf
         antlr4
         colorlog
         colorama
         six
         transformers
         huggingface_hub
         tokenizers
         safetensors
         regex
         requests
         packaging
         filelock
         fsspec
         jinja2
         networkx
         sympy
         mpmath
         markupsafe
         certifi
         charset_normalizer
         idna
         urllib3
         httpx
         httpcore
         anyio
         h11
         pydantic
         pydantic_core
         annotated_types
         typing_extensions
         typing_inspection
         torchgen
         functorch
         msgpack
         PIL
         flet
         flet_desktop
         rich
         markdown_it
         mdurl
         pygments
         tqdm
         psutil
         dotenv
         numpy
         scipy
         skimage
         yaml
         shapely
         onnxruntime
         torch
         torchvision
         core
         ui
         utils
         scripts

files=main.py
      config.py
      _kreuzberg_launcher.py
      kreuzberg.toml
      # Arquivos individuais sob $INSTDIR\assets (destino = pasta, nao o
      # nome do arquivo). Mapear "foo.ext > $INSTDIR\assets\foo.ext" faria
      # SetOutPath criar uma PASTA chamada foo.ext e a gravacao falharia.
      # KiwiDown.ico vai so via icon= (evita KiwiDown.1.ico por colisao de nome
      # no build\nsis quando files= e icon= copiam o mesmo basename).
      assets\kiwi_down.gif > $INSTDIR\assets
      # Cliente Flet com icone Kiwi Down (extraido em build\flet_runtime pelo
      # script de build). Nao colocar dentro de site-packages/flet_desktop:
      # o Flutter Windows inclui data\app.so e o Pynsist aborta ao ver .so.
      build\flet_runtime\flet > $INSTDIR\pkgs\flet_desktop\app
      .venv\Lib\site-packages\cv2 > $INSTDIR\pkgs\cv2
      # Destino = pkgs (nao pkgs\*.libs): senao NSIS aninha pasta/pasta e o NumPy
      # falha com "DLL load failed while importing _multiarray_umath".
      .venv\Lib\site-packages\numpy.libs > $INSTDIR\pkgs
      .venv\Lib\site-packages\scipy.libs > $INSTDIR\pkgs
      .venv\Lib\site-packages\shapely.libs > $INSTDIR\pkgs
